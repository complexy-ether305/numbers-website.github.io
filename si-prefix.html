<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  </head>
  <title>SI-Prefix LNGI</title>
  <style>
    @font-face {
      font-family: Numbers;
      src: url(FuturaPTBold.otf);
    }
    body {
      background: #000000;
      font-family: Numbers, sans-serif;
      color: #ffffff;
      text-align: center;
      font-size: 40px;
    }
    h2 {
      font-size: 60px;
    }
    .current {
      font-family: Numbers, monospace;
      font-size: 75px;
      color: white;
    }
    button {
      background: #000000;
      color: #ffffff;
      font-family: Numbers, sans-serif;
    }
  </style>
  <body>
    <div id="time">Loading...</div>
    <button onclick="set1=1-set1">Enable/Disable Space</button><br>
    <div class="current" id="current"></div>
    <div id="current2"></div>
    <script>
      let set1 = 0;
      function Level(x) {
        return `0 0 ${x/5}px`+(x<25?"":`, ${Level(x-25)}`);
      }
      function Abbreviations(x) {
        return ["","k","M","G","T","P","E","Z","Y","R"][x%10]+["","Q","A","H","KY","PJ","S","PC","N","ZT"][(x/10)%10|0];
      }
      function AbbreviationColor(x) {
        return `<span style="color:hsl(${(x-1)*36},${(x-1)*10}%,50%); text-shadow: ${Level(x-1)}">${Abbreviations(x)}</span>`;
      }
      function calculateSIPrefix(x) {
        if (x<3) {
          return (10**x).toFixed(2);
        } else {
          let i = Math.floor(x/3);
          return (10**(x%3)).toFixed(3-(x%3|0))+(set1==0?"":" ")+AbbreviationColor(i);
        }
      }
      function SIPrefixNames(x) {
        let names = ["","kilo","mega","giga","tera","peta","exa","zetta","yotta","ronna"];
        let names2 = ["","quetta","amosa","hapra","kyra","pija","sagana","pectra","nisaba","zotza"];
        return names[x%10|0]+names2[(x/10)%10|0];
      }
      function formatTime(x) {
        let x2 = x%86400;
        return "Day "+(x/86400+1|0)+" | "+[x2/36000%10|0,x2/3600%10|0,":",x2/600%6|0,x2/60%10|0,":",x2/10%6|0,x2%10|0].join('')
      }
      function Scientific10(x) {
        if (x<15) {
          return Math.floor(10**x).toLocaleString("en");
        } else {
          return (10**(x%1)).toFixed(6)+" × 10<sup>"+Math.floor(x).toLocaleString("en")+"</sup>"
        }
      }
      setInterval(_=>{
        let current = Date.now()/1000-1786556300;
        let P1k = Math.floor((Math.log10(current/100+1)*(current/(86400*3)+1))/3);
        document.getElementById("current").innerHTML = calculateSIPrefix(Math.log10(current/100+1)*(current/(86400*3)+1));
        document.getElementById("current2").innerHTML = Scientific10(Math.log10(current/100+1)*(current/(86400*3)+1))+"<br><br>"+SIPrefixNames(P1k)+` (${AbbreviationColor(P1k)})`;
        document.getElementById("time").innerHTML = formatTime(current);
      }, 1)
    </script>
  </body>
</html>
